[package]
name = "beaver"
version = "0.1.0"
edition = "2021"
description = "Turn complex shell commands into simple tags"

[[bin]]
name = "be"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
